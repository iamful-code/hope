# Проверка запуска под Windows: те же windows\*.cmd, что запускает пользователь.
# Установка -> тесты -> бэктест по архиву Bybit -> live paper 90 с на публичном WebSocket -> монитор -> автозапуск.
name: windows

on:
  push:
    branches: ["claude/**", "strategy/**"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      HOPE_NO_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py311
        with:
          python-version: "3.11"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install (windows\install.cmd)
        shell: cmd
        run: call windows\install.cmd dev

      - name: unit tests
        shell: cmd
        run: .venv\Scripts\python -m pytest -q

      - name: backtest (windows\backtest.cmd)
        shell: cmd
        run: call windows\backtest.cmd -c strategies\example_ema\config.yaml -s LINKUSDT --from 2026-09-24 --to 2026-09-24 --mode candles --db data\bt_ci.db

      - name: live paper 90 s (windows\run.cmd, strategy of this branch from .env)
        shell: cmd
        run: call windows\run.cmd --duration 90 --warmup 0

      - name: check live run in the database
        shell: cmd
        run: .venv\Scripts\python -c "import sqlite3, json; r = sqlite3.connect('data/hope.db').execute('select run_id, strategy, status, summary_json from runs order by run_id desc limit 1').fetchone(); s = json.loads(r[3] or '{}'); print('run', r[0], r[1], r[2], 'events', s.get('n_events'), 'fills', s.get('n_fills'), 'ws', s.get('ws')); assert r[2] == 'finished', r[2]; assert (s.get('n_events') or 0) >= 50, 'no market data from Bybit WebSocket'; print('market data OK')"

      - name: monitor (windows\monitor.cmd)
        shell: pwsh
        run: |
          $env:MONITOR_DB = "data/hope.db,data/bt_ci.db"
          $p = Start-Process -FilePath cmd.exe -ArgumentList "/c", "call windows\monitor.cmd" -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/api/runs; $ok = $r.StatusCode -eq 200 } catch {}
          }
          if (-not $ok) { throw "monitor did not start" }
          $runs = ($r.Content | ConvertFrom-Json).runs
          $runs | Select-Object id, name, strategy, mode, status, n_fills | Format-Table | Out-String | Write-Host
          if ($runs.Count -lt 2) { throw "expected live + backtest runs in the monitor" }
          $id = $runs[0].id
          (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8000/api/runs/$id/summary").StatusCode
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/
          if ($page.Content -notmatch "hope") { throw "dashboard page is wrong" }
          Get-CimInstance Win32_Process -Filter "Name='hope.exe'" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }

      - name: start.cmd - first run, second run with the monitor already up, wrong extra text
        shell: pwsh
        run: |
          function Stop-Hope { Get-CimInstance Win32_Process | Where-Object { $_.Name -in 'hope.exe','python.exe' -and $_.CommandLine -match 'hope' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue } }
          Stop-Hope; Start-Sleep -Seconds 2
          cmd /c "call windows\start.cmd --duration 15 --warmup 0"
          if ($LASTEXITCODE) { throw "start.cmd failed: $LASTEXITCODE" }
          $up = $false
          for ($i = 0; $i -lt 30 -and -not $up; $i++) { try { $up = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/api/runs).StatusCode -eq 200 } catch { Start-Sleep -Seconds 1 } }
          if (-not $up) { throw "start.cmd did not start the monitor" }
          $out = cmd /c "call windows\start.cmd --duration 10 --warmup 0" 2>&1 | Out-String
          $rc = $LASTEXITCODE; Write-Host $out
          if ($rc) { throw "second start.cmd failed: $rc" }
          if ($out -notmatch 'already running') { throw "second start.cmd did not reuse the running monitor" }
          $out = cmd /c "call windows\start.cmd  - engine + monitor" 2>&1 | Out-String
          $rc = $LASTEXITCODE; Write-Host $out
          if ($rc -ne 2) { throw "expected exit code 2 for extra text, got $rc" }
          if ($out -notmatch 'without extra text') { throw "no hint for extra text" }
          Stop-Hope
          exit 0

      - name: autostart on/off (windows\autostart.cmd)
        shell: cmd
        run: |
          call windows\autostart.cmd on
          if not exist "%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\hope-lab.cmd" exit /b 1
          type "%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\hope-lab.cmd"
          call windows\autostart.cmd off
          if exist "%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\hope-lab.cmd" exit /b 1

      - name: Cyrillic path with spaces, like C:\Users\<Cyrillic name>\hope (Python 3.11)
        shell: pwsh
        env:
          HOPE_PYTHON: ${{ steps.py311.outputs.python-path }}
        run: |
          $cyr = -join (0x0410,0x0434,0x043C,0x0438,0x043D,0x0438,0x0441,0x0442,0x0440,0x0430,0x0442,0x043E,0x0440 | ForEach-Object { [char]$_ })
          $dst = Join-Path $env:USERPROFILE "$cyr\my lab\hope"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Get-ChildItem -Force -Path . -Exclude .venv, data, .git | Copy-Item -Destination $dst -Recurse -Force
          Set-Location $dst
          Write-Host "repository copy: $dst"

          # 1) reproduce the reported bug on Python 3.11: an editable install is not importable from such a path
          & $env:HOPE_PYTHON --version
          & $env:HOPE_PYTHON -m venv .venv-editable
          .\.venv-editable\Scripts\python -m pip install -q --disable-pip-version-check --no-deps -e .
          Get-ChildItem .venv-editable\Lib\site-packages\*.pth | ForEach-Object { Write-Host "$($_.Name): $([System.BitConverter]::ToString([System.IO.File]::ReadAllBytes($_.FullName)))" }
          .\.venv-editable\Scripts\python -c "import hope" 2>&1 | Select-Object -Last 1 | Write-Host
          Write-Host "editable install importable on 3.11: $($LASTEXITCODE -eq 0)"
          Remove-Item -Recurse -Force .venv-editable

          # 2) windows\install.cmd (regular install) and the usual commands from this folder
          cmd /c "call windows\install.cmd dev"
          if ($LASTEXITCODE) { throw "install.cmd failed in $dst" }
          cmd /c "call windows\backtest.cmd -c strategies\example_ema\config.yaml -s LINKUSDT --from 2026-09-24 --to 2026-09-24 --mode candles --db data\bt_cyr.db"
          if ($LASTEXITCODE) { throw "backtest.cmd failed" }
          cmd /c "call windows\run.cmd -c strategies\example_ema\config.yaml --duration 30 --warmup 0"
          if ($LASTEXITCODE) { throw "run.cmd failed" }
          .\.venv\Scripts\python -c "import sqlite3, json; r = sqlite3.connect('data/hope.db').execute('select status, summary_json from runs order by run_id desc limit 1').fetchone(); s = json.loads(r[1]); print('live run', r[0], 'events', s['n_events']); assert r[0] == 'finished' and s['n_events'] >= 50"
          if ($LASTEXITCODE) { throw "live run in the Cyrillic path got no data" }

          $p = Start-Process -FilePath cmd.exe -ArgumentList "/c", "call windows\monitor.cmd --port 8010" -WorkingDirectory $dst -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8010/api/runs; $ok = $r.StatusCode -eq 200 } catch {}
          }
          if (-not $ok) { throw "monitor did not start in the Cyrillic path" }
          $runs = ($r.Content | ConvertFrom-Json).runs
          $runs | Select-Object id, name, mode, status, n_fills | Format-Table | Out-String | Write-Host
          if ($runs.Count -lt 1) { throw "monitor sees no runs in the Cyrillic path" }
          (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8010/api/runs/$($runs[0].id)/summary").StatusCode
          Get-CimInstance Win32_Process -Filter "Name='hope.exe'" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
