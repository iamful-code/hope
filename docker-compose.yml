# Запуск: docker compose up -d --build        (Windows: windows\docker.cmd up)
# Конфиг стратегии — переменная STRATEGY_CONFIG в .env (на ветке strategy/<имя> уже указан).
# Данные (SQLite) — HOPE_DATA: путь (./data, по умолчанию) или имя тома Docker (hope-data).
# На Windows используйте том hope-data: SQLite в режиме WAL ненадёжен на папках Windows, проброшенных в Docker.
# Монитор: http://localhost:${MONITOR_PORT:-8000}
services:
  engine:
    build:
      context: .
      args:
        EXTRAS: ${HOPE_EXTRAS:-}
    container_name: hope-engine
    restart: unless-stopped
    command: ["run", "--restart"]
    environment:
      - STRATEGY_CONFIG=${STRATEGY_CONFIG:-strategies/example_ema/config.yaml}
      - HOPE__store__db_path=/app/data/hope.db
      - HOPE__run__data_dir=/app/data
    volumes:
      - ${HOPE_DATA:-./data}:/app/data
      - ./strategies:/app/strategies:ro
      - ./config:/app/config:ro
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  monitor:
    build:
      context: .
      args:
        EXTRAS: ${HOPE_EXTRAS:-}
    container_name: hope-monitor
    restart: unless-stopped
    command: ["monitor", "--db", "/app/data/hope.db", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${MONITOR_PORT:-8000}:8000"
    volumes:
      - ${HOPE_DATA:-./data}:/app/data
    depends_on:
      - engine

volumes:
  hope-data:
