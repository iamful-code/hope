# BinHV45 (Freqtrade, 1m, реверсия к полосе Боллинджера) в движке hope через адаптер FreqtradeStrategy.
# По умолчанию класс BinHV45LS (лонг + зеркальный шорт); оригинал — class_name: BinHV45.
# Live:     hope run -c strategies/ft_binhv45/config.yaml
# Бэктест:  hope backtest -c strategies/ft_binhv45/config.yaml --mode candles --from 2026-09-17 --to 2026-09-25
run:
  name: ft_binhv45

exchange:
  category: linear
  orderbook_depth: 1
  symbols: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT, DOGEUSDT, ADAUSDT, LINKUSDT, AVAXUSDT, DOTUSDT, LTCUSDT,
            BCHUSDT, NEARUSDT, SUIUSDT, 1000PEPEUSDT]

fees:
  maker: 0.0002
  taker: 0.00055

paper:
  latency_ms: 60
  initial_equity_usd: 10000.0
  taker_slippage_bps: 1.0

risk:
  max_daily_loss_usd: 500.0
  max_gross_notional_usd: 6000.0
  max_position_notional_usd: 600.0
  max_open_orders_per_symbol: 2

strategy:
  class: hope.adapters.freqtrade.runner:FreqtradeStrategy
  timeframe: 1m
  history_bars: 300
  timer_ms: 1000
  params:
    strategy_path: strategies/ft_binhv45/BinHV45.py
    class_name: BinHV45LS
    stake_amount_usd: 100.0
    max_open_trades: 5
    fee: 0.00055
    check_secs: 5
    leverage: 1.0

backtest:
  taker_slippage_bps: 1.0
